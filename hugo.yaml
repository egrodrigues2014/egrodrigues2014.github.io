# Served from the root of a GitHub Pages user site, so no repo subpath.
# CI overrides this with the value from actions/configure-pages anyway.
baseURL: https://egrodrigues2014.github.io/

locale: en
title: "Elton Rodrigues — Data Engineer"

# Use Hugo modules to add theme
module:
  imports:
    - path: github.com/hugo-toha/toha/v4
  mounts:
    - source: static/files
      target: static/files
    - source: ./node_modules/flag-icons/flags
      target: static/flags
    - source: ./node_modules/@fontsource/mulish/files
      target: static/files
    - source: ./node_modules/katex/dist/fonts
      target: static/fonts
    # THIS LINE IS LOAD-BEARING. Declaring any `assets` mount replaces Hugo's
    # default one, exactly as declaring a `static` mount does — the behaviour this
    # config already documents for static/. Without it, every resources.Get under
    # assets/ returns nil and the build dies on
    # `$favicon.RelPermalink: nil pointer`, because header.html dereferences the
    # favicon without a guard. Found the hard way, one mount later.
    - source: assets
      target: assets
    # Mermaid as a standalone file, loaded on demand by our own
    # layouts/shortcodes/mermaid.html instead of being bundled into
    # application.js for every page. See that file for why.
    - source: ./node_modules/mermaid/dist
      target: assets/js/mermaid

# Manage languages
# For any more details, you can check the official documentation: https://gohugo.io/content-management/multilingual/
#
# Adding a language here WITHOUT creating its data/<lang>/ tree in the same
# commit gives that language an empty home page and a green build. The theme
# reads `index hugo.Data site.Language.Lang` and does NOT fall back to another
# language. That is how the upstream `bn` tree ended up broken.
#
# The key must match a theme i18n bundle or the entire UI silently falls back
# to the default language. v4.16.0 ships es.toml, pt-br.toml and pt-pt.toml
# but no pt.toml, hence `pt-br` and not `pt`.
#
# Flags derive from the locale, not the key: en -> gb, es-ES -> es, pt-BR -> br.
# No flagOverwrites required.
languages:
  en:
    locale: en
    label: English
    title: "Elton Rodrigues — Data Engineer"
    weight: 1
  es:
    locale: es-ES
    label: Español
    title: "Elton Rodrigues — Ingeniero de Datos"
    weight: 2
  pt-br:
    locale: pt-BR
    label: Português
    title: "Elton Rodrigues — Engenheiro de Dados"
    weight: 3
# default language for the content; served at the site root
defaultContentLanguage: en

# enableMissingTranslationPlaceholders is deliberately NOT set here.
#
# It renders any missing i18n key as "[i18n] key", which is exactly what you want
# while building the site and exactly what you do not want a visitor to read. So
# it lives in the `server` task in mise.toml as
# HUGO_ENABLEMISSINGTRANSLATIONPLACEHOLDERS=true: placeholders in development,
# where they are visible to the person who can fix them, and a plain English
# fallback in anything published.
#
# Verified rather than assumed — Hugo resolves that variable, and with it absent
# the key does not appear in `hugo config` at all.

# Take each page's date from git rather than from the file system, so
# <lastmod> in sitemap.xml carries the real commit date. This is what both
# workflows' `fetch-depth: 0` is for: with a shallow clone Hugo sees no history
# and the field comes out empty.
enableGitInfo: true

# Allow raw html in markdown file
markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 6
    ordered: false

# At least HTML and JSON are required for the main HTML content and
# client-side JavaScript search
outputs:
  home:
    - HTML
    - RSS
    - JSON

# Enable global emoji support
enableEmoji: true

# The theme ships no robots.txt, so this enables ours at layouts/robots.txt.
enableRobotsTXT: true

# Site parameters
params:
  # PRE-LAUNCH GATE — now open. The site is indexable.
  #
  # While true, layouts/robots.txt served "Disallow: /" and seo-extra.html emitted
  # <meta name="robots" content="noindex,nofollow">. Both were needed: robots.txt
  # stops crawling, but a URL discovered another way can still be listed, and the
  # meta is what actually prevents indexing. With it false, robots.txt switches to
  # "Allow: /" plus a Sitemap: line and the meta disappears.
  #
  # check-render asserts BOTH directions, so this switch is verified rather than
  # trusted: setting it back to true and forgetting to redeploy, or leaving a stray
  # noindex behind after launch, both fail the build.
  #
  # Deploying behind this gate from the start was deliberate: the baseURL and
  # asset-path bugs of this stack do not reproduce locally, because `hugo server`
  # serves from the root, and the broken og:image found that way is the proof.
  prelaunch: false

  # Background image of the landing page
  # Generated by scripts/make-background.mjs — a dark gradient, not artwork, and a
  # placeholder until real branding exists. It replaced the theme example site's
  # image, which was 346 KB and carried a mandatory Freepik attribution.
  #
  # Must stay raster: home.html calls .Resize on this four times with no SVG guard,
  # and Hugo cannot resize SVG. 1500px wide because that is the largest variant the
  # theme serves.
  background: /images/site/background.png
  # Background image of the landing page for dark theme
  #darkBackground: /images/site/background.jpg

  # Provide logos for your site. The inverted logo will be used in the initial
  # transparent navbar and the main logo will be used in the non-transparent navbar.
  logo:
    # SVG on purpose. header.html downscales a raster favicon to 42px wide and
    # skips the resize only for SVG, so a big PNG buys nothing; navbar.html skips
    # it for svg and gif too. `main` and `inverted` are inert while
    # override.scss hides .navbar-brand — kept so restoring the brand is one line.
    main: /images/site/monogram.svg
    inverted: /images/site/monogram-inverted.svg
    favicon: /images/site/monogram-badge.svg

  # GitHub repo of your site
  gitRepo: https://github.com/egrodrigues2014/egrodrigues2014.github.io
  # Default branch of your Git repo
  gitBranch: main

  # How many navbar entries before the rest fall into a "More" dropdown.
  #
  # The counter includes "Home" (navigators/navbar.html seeds $sectionCount := 1
  # and Home is always rendered), so 7 shows Home plus the six data sections —
  # not seven sections. At 6 it was hiding Certifications behind "More".
  #
  # Raised once the navbar brand was hidden, which freed 335 of the 1185px
  # container. Measured at 1200px, the width where navbar-expand-xl is still
  # expanded and therefore the tightest case; below it the whole bar collapses to
  # a toggler. Items summed against container, single row in all three:
  #
  #   en     777 / 1185   408px spare
  #   es     897 / 1185   288px spare
  #   pt-br  937 / 1185   248px spare
  #
  # So the per-language maxVisibleSections overrides that an earlier round planned
  # for Portuguese are not needed. Adding an eighth navbar section would want
  # re-measuring in pt-br, which has the least room.
  topNavbar:
    maxVisibleSections: 7

  # Configure various features of this theme
  features:
    # [Deprecated] Enable dark theme
    # This is a deprecated setting, but has not been removed to maintain backward compatibility
    # If `theme` is set, the `darkMode` setting will be discarded.
    # darkMode:
    #   enable: true

    # Configure theme color settings
    theme:
      enable: true
      services:
        light: true # enable light theme. default "true"
        dark: true # enable dark theme. default "true"
        default: system # can be either light, dark or system. default "system"

    # Enable and configure portfolio
    portfolio:
      enable: true

    # Enable and configure blog posts
    blog:
      enable: true
      showAuthor: true # shows the author of post (defaults true)
      # Share post on different social media
      shareButtons:
        facebook: true
        twitter: true
        linkedin: true
        reddit: true
        whatsapp: true
        email: true
        # tumblr: true
        # pocket: true
        # diaspora: true
        # mastodon: true

        # Enable & configure "Notes" features
    notes:
      enable: false

    # Enable comment feature. There, should be only one of them.
    comment:
      enable: false
      services:
        # disqus:
        #   shortName: <your disqus short name>
          # valine:
          #   appId: HTV6askWxVo3vOxlqjjaq2hd-MsYXbMMI
          #   appKey: pVrT3C85KGIuk27t07eh6bUC
          #   avatar: retro
          #   placeholder: Share your thought.
          #   lang: en
          #   recordIP: true
          #   enableQQ: true
          # utteranc:
          #   repo: github.com/<your-user>/<your-repo>
          #   issueTerm: title
          #   theme: github-light
          # giscus:
          #   repo: your-repo/name
          #   repoID: your-repo-id
          #   category: your-category
          #   categoryID: your-category-id
          # theme: light
          # map: url
          # reaction: 1
          # metadata: 0
          # inputPosition: bottom
          # crossOrigin: anonymous
          # commento:
          #   serverURL: cdn.commento.io
          #   autoInit: true
          #   hideDeleted: false

          # Enable Analytics
    analytics:
      enable: true
      services:
        # TWO flags are required, not one. analytics.html wraps everything in
        # `{{ if or .enable .enabled }}` on THIS map as well as on analytics above,
        # and in `hugo.IsProduction`. Setting only analytics.enable and the code
        # renders nothing at all, silently — and `hugo server` never shows it either,
        # so it has to be checked on a production build.
        enable: true
        # GoatCounter. Chosen over GA4 because it sets no cookies, does no
        # fingerprinting and does not retain IPs — it derives the country and
        # discards them. That is what keeps it out of consent-banner territory,
        # which is why GA4 was ruled out.
        #
        # Accepted cost, stated plainly: this loads gc.zgo.at/count.js, the only
        # third-party request the site makes. Removing buttons.github.io and jsDelivr
        # got that count to zero, and this puts it back at one. Inherent to any
        # hosted analytics; self-hosting is possible via `instance` instead of
        # `code`, but needs a server, which GitHub Pages is not.
        #
        # It does NOT count CV downloads: the script fires on page load, and a PDF
        # is not a page load. And ad blockers block gc.zgo.at, so the numbers are a
        # floor rather than the truth.
        goatCounter:
          code: egrodrigues
        # # Google Analytics — needs a cookie consent banner under GDPR/AEPD.
        # google:
        #   id: <your google analytics id>
        # # CounterDev
        # counterDev:
        #   id: <your counterdev id>
        # # Matomo / Piwik
        # matomo:
        #   instance: matomo.example.com
        #   siteId: 1 # Or any other number

        # Enable Support
    support:
      enable: false
      services:
        # kofi:
        #   user: <your ko-fi user>
        #   text: Tip Me
        #   textColor: '#f9fafc'
        #   backgroundColor: '#248aaa'
        # buymeacoffee:
        #   user: <your buymeacoffee.com user>
        #   text: Support me on Buy me a coffee!
        #   info: Buy me a coffee!
        #   color: '#FFDD00'

        # specify whether you want to show Table of Contents in reading page
    toc:
      enable: true

    # Show tags under the post title
    tags:
      enable: true
      on_card: true # enables tags in post cards

    # Specify whether to show flag in the language selector. Default is true.
    flags:
      enable: true
      # # If you want to use different country flag for a language, specify them here.
      # flagOverwrites:
      #   - languageCode: en
      #     countryCode: us

      # Enable this to use `embed-pdf` shortcode.
      #
      # DISABLED on purpose. The feature's script loads pdf.js from
      # cdn.jsdelivr.net on EVERY page, whether or not a PDF is embedded —
      # confirmed in production, and the demo post that used the shortcode is
      # gone. That is a third-party request leaking every visitor's IP for a
      # feature nobody uses, which also undercuts the reason we skipped
      # analytics: no third parties, so no consent banner.
      #
      # Re-enable only alongside an actual embed-pdf shortcode, and decide then
      # whether to accept the CDN or self-host pdf.js.
    embedpdf:
      enable: false

    # Enable this to create flowcharts using shortcodes.
    flowchart:
      # Disabled so esbuild tree-shakes mermaid out of application.js: it was 3133 KB
      # of a 5974 KB bundle, paid for by every page including the home, which has no
      # diagram. layouts/shortcodes/mermaid.html loads the standalone build instead,
      # only where a diagram exists. The mermaid: settings below are still read from
      # here by that shortcode, so this stays the single source for the theme names.
      enable: false
      services:
        # Uncomment for `mermaid` shortcode.
        mermaid:
          # For config options, see: https://mermaid-js.github.io/mermaid/#/Setup?id=configuration
          theme: forest
          # Explicit, though `dark` is also what both the theme's JS and our
          # shortcode fall back to. Verified working: switching data-theme takes the
          # node fill from light lavender to near-black and the labels from dark grey
          # to light, so a diagram rendered in light mode does not stay light on a
          # dark page.
          darkTheme: dark

    # Enable this to create mathematic expressions using `$$` blocks
    math:
      enable: false
      services:
        # https://katex.org/docs/autorender.html#api for more configurations
        katex:
          delimiters:
            - left: $$
              right: $$
              display: true
            - left: \\[
              right: \\]
              display: true
            - left: $
              right: $
              display: false
            - left: \\(
              right: \\)
              display: false

    # Enable to use custom syntax highlight
    # Please note, Hugo comes with it's own html based syntax highlighter.
    # Your code block will still be syntax highlighted by hugo.
    # For more details: https://gohugo.io/content-management/syntax-highlighting/
    # To disable Hugo's builtin syntax highlight,
    # see: https://gohugo.io/getting-started/configuration-markup#highlight
    # ```
    # # config.yaml
    # markup:
    #   # this disables hugo's syntax highlighting.
    #   codeFences: false
    # ```
    syntaxHighlight:
      enable: true
      services:
        hljs:
          # see: https://highlightjs.readthedocs.io/en/latest/api.html#configure
          noHighlightRe: /^no-highlight$/i

    # Enable to use `video-player` shortcode
    videoPlayer:
      enable: false
      services:
        # convert .js-player class into video player via https://plyr.io/
        # Can play HTML5 Video, Audio, Youtube, Vimeo.
        # For more info on setup: https://github.com/sampotts/plyr#quick-setup
        plyr:
          # options doc: https://github.com/sampotts/plyr#options
          # fullscreen: true

          # Enables copy code button
    copyCodeButton:
      enable: true

    # Enable reading time support in post cards and in post pages
    readingTime:
      enable: false

    # Number of posts to show to each page. Default is "12"
    pagination:
      maxPostsPerPage: 12

  # Provide footer configuration.
  footer:
    enable: true
    # You can provide your custom footer template using this option.
    # Put your template in "layouts/partials" folder of your repo.
    template: footer.html
    # Show/hide navigation in the footer. Default is "true".
    navigation:
      enable: true
      # show custom menus in the footer
      customMenus: true
    # Show/hide "Contact Me" section in the footer. Default is "true".
    contactMe:
      enable: true
    # Show/hide credentials section in the footer. Default is "true".
    credentials:
      enable: true

    # Show/hide newsletter section in the footer. Default is "true".
    # Currently, it supports "mailchimp".
    newsletter:
      enable: false
      # provider: mailchimp
      # mailchimpURL: https://github.us1.list-manage.com/subscribe/post?u=19de52a4603135aae97163fd8&amp;id=094a24c76e

      # Show/hide disclaimer notice in the footer. Default is "false".
    disclaimer:
      enable: true
