# Pinned on purpose. With 'latest', a release of Hugo, Node or Go can break
# the build without a single line changing in this repo, and you cannot tell
# your own mistake from a toolchain regression. Bump these deliberately
# (see the maintenance section of the README).
[tools]
hugo-extended = '0.164.0'  # extended is required: the theme compiles SCSS
node = '24.19.0'           # only supplies the theme's front-end assets via npm
go = '1.26.5'              # only used by Hugo Modules to fetch the theme

[tasks.install]
description = "Install dependencies"
run = ["hugo mod tidy", "hugo mod npm pack", "npm install", "npm install --prefix scripts"]

[tasks.build]
description = "Build Hugo site"
depends = ["install"]
# --cleanDestinationDir matters: without it Hugo leaves stale output behind, so
# a deleted section keeps being served locally and a removal looks like it did
# not work (or worse, looks like it did when it did not).
#
# --panicOnWarning turns Hugo's warnings into failures. It is safe to have here
# because the build is verified clean under it; see the note on `verify`.
run = "hugo --gc --minify --cleanDestinationDir --panicOnWarning"

# The gate to run before every commit. Also what CI runs, so that a green
# local run means something.
#
# check-demo joined this list once it reached zero. It was held out while it was
# still counting down, because a permanently red gate is one you learn to ignore.
# Now that it is green, it is a one-way door: a line of the theme's example data
# reappearing fails the build instead of adding to a tally nobody reads.
[tasks.verify]
description = "Run all QA checks"
run = [
  "node scripts/check-i18n.mjs",
  "node scripts/check-assets.mjs",
  "node scripts/check-pii.mjs",
  "node scripts/check-demo.mjs",
  "node scripts/check-overrides.mjs",
  # --printPathWarnings surfaces duplicate target paths; --panicOnWarning makes
  # every Hugo warning a failure instead of a line nobody reads. Added only after
  # confirming the build is clean under it, and proved by injecting a warnf: the
  # same warning exits 0 without the flag and 1 with it.
  "hugo --gc --minify --cleanDestinationDir --printPathWarnings --panicOnWarning",
  "node scripts/check-render.mjs",
]

# Kept as its own task as well: it is the fastest single check to run when
# pasting anything in from the theme's documentation or its example site.
[tasks."check-demo"]
description = "Fail if any trace of the theme's example site is back"
run = "node scripts/check-demo.mjs"

# Deliberately NOT part of `verify`: it goes out to the network, so it is slow and
# other people's uptime can fail your build. Run it before publishing, and after
# adding any external link.
#
# The skip-list in scripts/linkinator.config.json is what makes it useful rather
# than noise — every entry there is a host that answers a bot differently from a
# browser, or a share-button URL that is not a content link at all. Without it the
# run is ~90% false positives and gets ignored, which is the same as not having it.
#
# It has already earned its place: it caught https://www.nttdata.com/ returning 404
# ten minutes after that URL was added.
[tasks."check-links"]
description = "Check every external link in the built site"
depends = ["build"]
run = "npx --yes linkinator@6 ./public --config scripts/linkinator.config.json"

[tasks.server]
description = "Run hugo server"
depends = "install"
# Missing i18n keys render as "[i18n] key" here and nowhere else. Setting it as an
# env var rather than in hugo.yaml is what keeps it out of the published site,
# where the placeholder would be worse for a visitor than an English fallback.
# Hugo maps HUGO_<UPPERCASED KEY> onto config; confirmed with `hugo config`.
env = { HUGO_ENABLEMISSINGTRANSLATIONPLACEHOLDERS = "true" }
run = "hugo server -w"

[tasks.update]
description = "Update the theme to latest release"
run = "hugo mod get -u"
depends_post = "install"

