# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it.
section:
  name: Education
  id: education                         # FIXED
  template: sections/education.html     # FIXED (alternative: sections/education-alt.html, more compact)
  enable: true                          # FIXED
  weight: 50                            # FIXED
  showOnNavbar: true                    # FIXED

# `icon` is BARE here: sections/education.html prepends "fas " itself. Adding
# the prefix would emit class="fas fas fa-x". cards/skill.html works the other
# way round and does need the prefix — two conventions in the same theme.
#
# No `grade`: CGPA scales do not compare across Brazil, Spain and the
# anglosphere, so a bare number misleads. No `takenCourses`: coursework with
# marks fills half a screen and adds nothing next to seven years of experience.
# Institution logos are nil-guarded in the theme, so their absence is safe.
degrees:
- name: B.E. in Control and Automation Engineering
  icon: fa-gears                       # FIXED
  timeframe: "2016 - 2018"                # FIXED
  institution:
    name: Universidade Federal do ABC         # FIXED
    url: "https://www.ufabc.edu.br"  # FIXED
    logo: images/sections/education/ufabc.png
    # Same file for both: dark artwork on an opaque white background, so
    # inverting it for dark mode would wreck the brand colours. The white
    # background blends into the white card in light mode and reads as a
    # deliberate chip in dark mode, brand intact either way.
    #
    # darkLogo is defensive, not required. The theme ships CSS that hides
    # .light-logo and shows .dark-logo under html[data-theme=dark], but in
    # v4.16.0 those rules never reach the page — measured: with darkLogo removed
    # the light logo still renders in real dark mode. Setting it anyway means the
    # logo will not vanish if a future version starts applying that swap.
    darkLogo: images/sections/education/ufabc.png
  customSections:
  - name: Final project
    content: "Publication: *Landslide Detection System: Design and Development*"

- name: BSc in Science and Technology
  icon: fa-graduation-cap                       # FIXED
  timeframe: "2011 - 2016"                # FIXED
  institution:
