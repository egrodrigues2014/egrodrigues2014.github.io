# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it, including the number of bullets
# per position — a translation one bullet short is invisible otherwise.
section:
  name: Experience
  id: experiences                       # FIXED
  enable: true                          # FIXED
  weight: 30                            # FIXED
  showOnNavbar: true                    # FIXED

# Dates are MM/YYYY and FIXED. Month names would need translating three times
# ("Mar 2022" reads wrong in Spanish and Portuguese) — 39 more strings and 39
# more chances to misalign a month. Omitting `end` makes the theme insert its
# own localised [present] key, so never write "Present" by hand.
#
# "Lead Data Engineer" and "Senior Data Engineer" stay in English in all three
# languages: that is how the roles are named in the market and "Lead" has no
# settled equivalent. The older titles DO get translated — "SAS Consultant"
# becomes "Consultor SAS" — so the field is translatable and only those two
# values are exempt. Both are listed in INTENTIONALLY_IDENTICAL in
# scripts/check-i18n.mjs, which is what stops them warning forever.
#
# No company logos yet: those fields are nil-guarded in the theme, so the cards
# render without them. Adding one is safe at any time.
experiences:
- company:
    name: MOD — Makers of Digital
    url: "https://mod.es"
    location: Barcelona, Spain
    overview: Digital consultancy in Barcelona building data and software products.
  positions:
  - designation: Lead Data Engineer
    start: "02/2026"
    # end omitted on purpose -> localised [present]
    responsibilities:
    - "Architect medallion lakehouse layers (bronze/silver/gold) across Azure Data Lake Storage Gen2, Azure SQL and Microsoft Fabric, sizing each database architecture to the workload rather than to a template."
    - "Build and maintain ETL/ELT pipelines in Python, Azure Data Factory and Airflow, ingesting from relational databases, REST APIs and ERP/CRM systems; incremental, parameterised load patterns cut both the refresh window and the compute bill."
    - "Model the warehouse in [dbt](https://www.getdbt.com/) — star schemas, SCD Type 2 and snapshot facts — with version control, automated tests and documented lineage, tuned through partitioning, indexing and pre-aggregation."
    - "Design enterprise Power BI semantic models, including composite Import + DirectQuery, with advanced DAX (time intelligence, variance analysis, many-to-many bridges) and governance: row-level security, incremental refresh, on-premises gateways and deployment pipelines."
    - "Own CI/CD with Git and define the branching methodology, repository structure and onboarding standards for the data department; productionise forecasting models (Prophet, scikit-learn) that drive demand planning and per-location purchasing recommendations."

