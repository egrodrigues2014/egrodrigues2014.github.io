# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it.
section:
  name: About
  id: about                             # FIXED
  enable: true                          # FIXED
  weight: 10                            # FIXED
  showOnNavbar: true                    # FIXED
  template: sections/about.html         # FIXED

# Job title. Intentionally the same in all three languages: this is how the
# role is named in the market, and "Lead" has no settled translation. The
# per-language site title in site.yaml does localise the role, because that is
# prose for a browser tab rather than a job title.
designation: Lead Data Engineer

company:
  name: MOD — Makers of Digital         # FIXED (proper noun)
  url: "https://mod.es"                 # FIXED
  overview: Digital consultancy in Barcelona building data and software products.

# Markdown inline is allowed here, so the key technologies link out.
summary: 'Lead Data Engineer with 7+ years designing and automating ETL/ELT, and turning the result into products teams actually decide with. I build end-to-end [Azure](https://azure.microsoft.com/) and [Microsoft Fabric](https://www.microsoft.com/microsoft-fabric) platforms for agri-food, retail and food service: ingestion from ERP/CRM systems, APIs and databases, medallion lakehouse layers, [dbt](https://www.getdbt.com/) models and enterprise Power BI semantic models. Before that, insurance, banking and risk — where data quality and auditability were non-negotiable.'

# Only links that go somewhere. The inherited file had nine entries, five of
# them pointing at "#", which reads as padding. No email icon by decision: an
# address on an indexed page is a permanent spam magnet.
socialLinks:
- name: LinkedIn
  icon: "fab fa-linkedin"               # FIXED
  url: "https://www.linkedin.com/in/engineer-elton-rodrigues"   # FIXED

- name: GitHub
  icon: "fab fa-github"                 # FIXED
  url: "https://github.com/egrodrigues2014"                     # FIXED

# Restored in F5 once the curated per-language CVs exist as
# static/files/cv-elton-rodrigues-<lang>.pdf. Left empty rather than pointing
# at the deleted demo PDF, because a 404 behind a "My Resume" button is worse
# than no button.
resourceLinks: []

# The badge grid holds languages rather than certifications. Only one vendor
# certification is actually achieved (AZ-900), and a grid built for three or six
# tiles looks broken with one; the certifications live in the Accomplishments
# section instead, which scales to a list. Languages also earn their place here:
# they are verifiable, useful to a recruiter, and they explain why this site
# exists in three of them.
#
# The inherited file used this block for self-assigned "Leadership 85%" style
# indicators, which is the single most common portfolio cliché and carries no
# information.
# Only certifications that carry official issuer artwork. Languages were tried
# here and removed: five tiles read as a grab bag, and the grid is col-6 col-lg-4
# so they never filled rows cleanly either. More certifications get added here as
# they arrive.
#
# Power BI (Udemy) and CS50 (Harvard) stay out because their issuers publish
# document-style certificates, not badges — inventing square artwork from a
# product icon would look inconsistent beside real badges. They lead the
# Certifications section instead.
#
# Both images are pre-sized to 150x150: the theme sets no width or height on
# .certificate-badge, so the intrinsic size is the rendered size. Self-hosted
# under static/files/ because badge: is a raw <img src> with no pipeline, and an
# issuer URL change would break this silently.
badges:
- type: "certification"                 # FIXED
  name: "Data Engineer Associate"       # FIXED (credential name as issued)
  url: "https://www.datacamp.com/certificate/DEA0018012967900"   # FIXED
  badge: /files/badges/datacamp-data-engineer-associate.png      # FIXED

- type: "certification"                 # FIXED
  name: "Microsoft Certified: Azure Fundamentals (AZ-900)"       # FIXED
  url: "https://learn.microsoft.com/users/eltonguilhermerodrigues-9591/credentials/e5511530da2f13ef"   # FIXED
  badge: /files/badges/microsoft-certified-az-900.svg            # FIXED
