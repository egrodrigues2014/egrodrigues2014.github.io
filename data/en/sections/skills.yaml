# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it.
section:
  name: Skills
  id: skills                            # FIXED
  enable: true                          # FIXED
  weight: 20                            # FIXED
  showOnNavbar: true                    # FIXED
  filter: true                          # FIXED

# Five categories plus All. "Databases" was folded into Cloud & Data Platforms:
# the split between it and Data Engineering was never clear and cost a click to
# work out.
#
# `filter` is a CSS/JS token the theme writes into data-category, never a label.
# Translating one detaches it from every card that claims it, and the button then
# empties the section. The checker asserts each button matches at least one card.
buttons:
- name: All
  filter: "all"
- name: Cloud & Data Platforms
  filter: "cloud"
- name: Languages
  filter: "languages"
- name: Data Engineering
  filter: "de"
- name: BI & Analytics
  filter: "bi"
- name: Ways of Working
  filter: "wow"

# Every card is icon + name + one sentence. All 25 use `logo:` rather than
# `icon:` because that path renders the mark and the title as separate elements,
# which is the layout we want; `icon:` puts the glyph inside the <h5>.
#
# The icons are 25 self-hosted monochrome SVGs, not a CDN — a CDN here would undo
# the privacy work that removed jsDelivr from the site. Brand marks come from
# Simple Icons (CC0); concepts and the whole Microsoft family come from Bootstrap
# Icons (MIT), because Simple Icons has withdrawn every Microsoft mark. That also
# avoids the spec's complaint about one icon repeated across four cards.
#
# CAUTION: cards/skill.html reads .MediaType on the result of resources.Get
# WITHOUT a nil check, so a logo path that does not exist fails the whole build.
# check-i18n treats a dangling skills[].logo as a fatal error and runs before the
# build, in `verify` and in CI, which is what keeps that from biting.
skills:
- name: Microsoft Azure
  logo: /images/sections/skills/azure.svg
  summary: "Data Factory, Azure SQL, ADLS Gen2 and PostgreSQL running production data platforms."
  categories: ["cloud"]

- name: Microsoft Fabric
  logo: /images/sections/skills/fabric.svg
  summary: "OneLake, Lakehouse and Warehouse for end-to-end platforms, in active production development."
  categories: ["cloud", "de"]

- name: Power BI
  logo: /images/sections/skills/powerbi.svg
  summary: "Composite Import + DirectQuery semantic models, RLS, incremental refresh and gateways."
  categories: ["bi"]

- name: Python
  logo: /images/sections/skills/python.svg
  summary: "pandas for data pipelines, Prophet and scikit-learn for forecasting."
  categories: ["languages", "de"]

- name: SQL
  logo: /images/sections/skills/sql.svg
