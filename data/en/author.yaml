# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. The cross-language checker enforces it: run `mise run verify`.
# Everything else is prose and should differ per language.

name: Elton Rodrigues                 # FIXED
nickname: Elton                       # FIXED (a nickname is a proper noun)
greeting: "Hi, I am"

# Path without a leading slash, matching this file's own convention; Hugo
# resolves it from assets/ and runs it through the image pipeline.
# Source was a 1600x1600 PNG at 797 KB, downscaled to 800x800 JPEG at quality
# 82 -> 44 KB. The alpha channel was verified unused, so JPEG costs nothing.
image: images/author/elton.jpg        # FIXED

# The KEYS below are lookup keys, never labels. Translating one silently drops
# its icon, which is the exact defect the upstream Bengali file had. FIXED.
contactInfo:
  linkedin: engineer-elton-rodrigues
  github: egrodrigues2014
# No `email` and no `phone` by decision: a mail address on an indexed page is a
# permanent spam magnet, and LinkedIn is the channel a recruiter uses anyway.

# Rotating lines for the typewriter effect on the landing page.
summary:
  - "Lead Data Engineer based in Barcelona"
  - "I build data platforms on Azure and Microsoft Fabric"
  - "From ERP ingestion to Power BI semantic models"
  - "Trilingual: Português · Español · English"
