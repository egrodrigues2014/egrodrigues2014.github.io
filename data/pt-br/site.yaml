# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. The cross-language checker enforces it: run `mise run verify`.
# Everything else is prose and should differ per language.

# NOT RENDERED at present: assets/styles/override.scss hides .navbar-brand
# entirely, so nothing from here reaches the page. Kept because restoring the
# brand is a one-line change, and because it records the intended short form.
#
# The theme falls back to site.Title when this is
# absent, so the browser tab and the OpenGraph card keep the longer form with
# the localised role. Kept short because the full title consumed 32% of the
# navbar container and made it wrap to two rows in Portuguese at 1200px.
# Identical in all three languages: it is a brand, not prose. FIXED.
navBarTitle: "Elton Rodrigues · Data Engineer"

copyright: "© 2026 Elton Rodrigues"

# Shown in the footer. Covers both the content licence and the attribution the
# theme's MIT licence asks for.
disclaimer: "Conteúdo © 2026 Elton Rodrigues. Todos os direitos reservados. Feito com [Hugo](https://gohugo.io) e o tema [Toha](https://github.com/hugo-toha/toha) (MIT)."

# Meta description. Keep it near 150-160 characters.
description: "Lead Data Engineer em Barcelona. Construo plataformas de dados no Azure e no Microsoft Fabric: ETL/ELT, dbt, Airflow e modelos semânticos de Power BI."

# Extra navbar/footer entries. Empty: the inherited one pointed at the theme's
# own documentation site.
customMenus: []

openGraph:
  title: "Elton Rodrigues — Engenheiro de Dados"
  type: website                       # FIXED
  description: "Lead Data Engineer em Barcelona. Construo plataformas de dados no Azure e no Microsoft Fabric: ETL/ELT, dbt, Airflow e modelos semânticos de Power BI."
  # Must be a path under static/, not assets/. The theme runs this through
  # absURL with no image processing, so an assets/ path publishes nothing and
  # 404s. static/files is mounted in hugo.yaml, static/images is not.
  # 1200x630, generated by scripts/make-og-card.mjs. That is the shape LinkedIn
  # composes its large card at; the 800x800 photo this replaced got demoted to a
  # small thumbnail beside the text.
  image: files/og-elton-rodrigues.png   # FIXED
  url: "https://egrodrigues2014.github.io/pt-br/"          # per-language canonical, so NOT fixed
