# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it, including the number of bullets
# per position — a translation one bullet short is invisible otherwise.
section:
  name: Experiência
  id: experiences                       # FIXED
  enable: true                          # FIXED
  weight: 30                            # FIXED
  showOnNavbar: true                    # FIXED

# Dates are MM/YYYY and FIXED. Month names would need translating three times
# ("Mar 2022" reads wrong in Spanish and Portuguese) — 39 more strings and 39
# more chances to misalign a month. Omitting `end` makes the theme insert its
# own localised [present] key, so never write "Present" by hand.
#
# No company logos yet: those fields are nil-guarded in the theme, so the cards
# render without them. Adding one is safe at any time.
experiences:
- company:
    name: MOD — Makers of Digital
    url: "https://mod.es"
    location: Barcelona, Espanha
    overview: Consultoria digital em Barcelona que constrói produtos de dados e software.
  positions:
  - designation: Lead Data Engineer
    start: "02/2026"
    # end omitted on purpose -> localised [present]
    responsibilities:
    - "Projeto camadas de lakehouse medallion (bronze/silver/gold) sobre Azure Data Lake Storage Gen2, Azure SQL e Microsoft Fabric, dimensionando cada arquitetura à carga real e não a um template."
    - "Construo e mantenho pipelines ETL/ELT em Python, Azure Data Factory e Airflow, com ingestão de bancos relacionais, APIs REST e sistemas ERP/CRM; os padrões de carga incremental e parametrizada reduzem a janela de processamento e o custo de computação."
    - "Modelo o data warehouse em [dbt](https://www.getdbt.com/) — esquemas estrela, SCD tipo 2 e fatos snapshot — com controle de versão, testes automatizados e linhagem documentada, otimizado com particionamento, indexação e pré-agregação."
    - "Projeto modelos semânticos corporativos de Power BI, incluindo compostos Import + DirectQuery, com DAX avançado (time intelligence, análise de desvios, pontes M:N) e governança: segurança em nível de linha, refresh incremental, gateways on-premises e pipelines de deploy."
    - "Sou responsável pelo CI/CD com Git e defino a estratégia de branches, a estrutura de repositórios e os padrões de onboarding do departamento de dados; levo a produção modelos de forecasting (Prophet, scikit-learn) que alimentam o planejamento de demanda e as recomendações de compra por unidade."

