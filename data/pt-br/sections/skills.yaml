# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it.
section:
  name: Competências
  id: skills                            # FIXED
  enable: true                          # FIXED
  weight: 20                            # FIXED
  showOnNavbar: true                    # FIXED
  filter: true                          # FIXED

# Filter buttons. `filter` is a CSS/JS token, never a label: translating one
# detaches it from every skill's `categories` and the button then empties the
# section. The checker asserts that each button matches at least one skill.
buttons:
- name: Tudo
  filter: "all"                    # FIXED
- name: Cloud e Plataformas
  filter: "cloud"                    # FIXED
- name: Linguagens
  filter: "languages"                    # FIXED
- name: Engenharia de Dados
  filter: "data-engineering"                    # FIXED
- name: BI e Analytics
  filter: "bi"                    # FIXED
- name: Bancos de Dados
  filter: "databases"                    # FIXED
- name: Forma de Trabalhar
  filter: "ways-of-working"                    # FIXED

# WARNING: cards/skill.html is the theme's only resources.Get without a nil
# guard. A `logo:` pointing at a file that does not exist fails the entire build
# with "nil pointer evaluating resource.Resource.MediaType" — verified. `icon:`
# is the guarded fallback, so anything without a real asset uses an icon. To
# move one to a logo: add the file first, then switch, then build.
