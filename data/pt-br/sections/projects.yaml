# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it, including the number of projects —
# a card missing from one language is invisible otherwise.
section:
  name: Projetos
  id: projects                          # FIXED
  enable: true                          # FIXED
  weight: 40                            # FIXED
  showOnNavbar: true                    # FIXED

# `filter` is a CSS/JS token the theme writes into data-category, never a label.
# The checker asserts each button matches at least one project, because a button
# with no match empties the section when clicked.
buttons:
- name: Todos
  filter: "all"                         # FIXED
- name: Azure e Fabric
  filter: "azure"                       # FIXED
- name: Power BI
  filter: "power-bi"                    # FIXED
- name: Python e ML
  filter: "python"                      # FIXED
- name: SQL e ETL
  filter: "sql"                         # FIXED

# Cada projeto e trabalho de cliente: privado, sob confidencialidade e sem repo
# publico. Cada cartao aponta para um post de caso de estudo, que e tambem o que
# da conteudo ao blog. O empregador e o setor sao nomeados, o cliente final nunca,
# e todos os numeros dos posts sao relativos.
#
# `repo:` nao e usado: o tema o renderiza como botao de estrelas do GitHub, e
# todos estes projetos sao privados. `url:` da um botao de detalhes.
#
# Correcao: escolher `url:` NAO evitava a requisicao a terceiros. O tema chama
# insertScript com buttons.github.io no escopo de modulo em
# assets/scripts/sections/projects.js, e application.js importa './sections'
# sempre, entao a requisicao saia em todas as paginas. Isso agora e removido pela
# copia local desse script.
#
# `tags` e FIXED *e* renderizado como chips visiveis, entao aparece sem traducao
# em /es/ e /pt-br/. Por isso sao nomes de tecnologia em minuscula.
projects:
- name: Medallion lakehouse on Azure and Fabric
  logo: /images/sections/skills/medallion.svg   # FIXED
  role: Arquiteto e desenvolvedor principal
  timeline: "02/2026"                   # FIXED
  url: /posts/medallion-lakehouse-azure-fabric/ # FIXED
  target: "self"                        # FIXED
  summary: "Camadas bronze, prata e ouro sobre ADLS Gen2, Azure SQL e Microsoft Fabric, com modelos dbt, linhagem gerada e cargas incrementais parametrizadas. A janela de atualização saiu de um lote noturno que transbordava para a manhã para um ciclo de hora em hora."
  tags: ["azure", "fabric", "dbt", "airflow"]   # FIXED

- name: Enterprise Power BI semantic model
  logo: /images/sections/skills/powerbi.svg     # FIXED
  role: Responsável pelo modelo semântico
  timeline: "02/2026"                   # FIXED
  url: /posts/enterprise-power-bi-semantic-model/ # FIXED
  target: "self"                        # FIXED
  summary: "Um único modelo compartilhado em vez de vários arquivos de relatório que discordavam sobre a margem: composite Import mais DirectQuery com corte por período, segurança em nível de linha governada por dados e não por DAX fixo, e atualização incremental que dobra para a origem."
  tags: ["power-bi", "dax", "azure"]    # FIXED

- name: Natural-language analytics over the semantic model
  logo: /images/sections/skills/llm.svg # FIXED
  role: Concepção e implementação
  timeline: "02/2026"                   # FIXED
  url: /posts/natural-language-analytics-mcp/   # FIXED
  target: "self"                        # FIXED
  summary: "Perguntas em linguagem natural resolvidas contra o modelo semântico do Power BI por um servidor MCP e a API do Claude, de modo que as definições de negócio e a segurança em nível de linha fiquem dentro da fronteira em vez de serem redescobertas a cada pergunta."
  tags: ["python", "llm", "power-bi"]   # FIXED

- name: Demand forecasting and purchasing recommendations
  logo: /images/sections/skills/forecasting.svg # FIXED
  role: Modelagem e entrada em produção
  timeline: "02/2026"                   # FIXED
  url: /posts/demand-forecasting-purchasing/    # FIXED
  target: "self"                        # FIXED
  summary: "Prophet e scikit-learn por série, pontuados contra uma linha de base naive sazonal em um backtest de origem móvel e com horizonte fixado no prazo de entrega do fornecedor, terminando em uma recomendação de compra por unidade e não em um gráfico."
  tags: ["python", "forecasting", "power-bi"]   # FIXED

- name: Delivery, productivity and quality analytics
  logo: /images/sections/skills/dashboards.svg  # FIXED
  role: Modelador de dados
  timeline: "01/2023 — 02/2026"         # FIXED
  url: /posts/delivery-productivity-quality-model/ # FIXED
  target: "self"                        # FIXED
  summary: "Um esquema estrela com dimensões conformadas para esforço, entrega, produtividade e qualidade de times de consultoria, com métricas definidas como razões e denominador explícito — modelado para dar tendências por time e não conseguir produzir uma tabela de classificação."
  tags: ["power-bi", "sql"]             # FIXED

- name: Self-healing fraud-alert ETL
  logo: /images/sections/skills/etl.svg # FIXED
  role: Responsável pelo processo
  timeline: "01/2020 — 12/2022"         # FIXED
  url: /posts/fraud-alert-etl-resilience/       # FIXED
  target: "self"                        # FIXED
  summary: "Geração de alertas de fraude para sinistros de automóvel, de ponta a ponta. Passos idempotentes, checkpoints nas fronteiras entre passos e um watchdog que separa falhas transitórias das reais transformaram uma ligação às 3 da manhã em uma execução retomada."
  tags: ["sas", "sql", "linux"]         # FIXED
