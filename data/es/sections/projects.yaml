  summary: "Preguntas en lenguaje natural resueltas contra el modelo semántico de Power BI mediante un servidor MCP y la API de Claude, de modo que las definiciones de negocio y la seguridad a nivel de fila quedan dentro de la frontera en lugar de redescubrirse en cada pregunta."
  tags: ["python", "llm", "power-bi"]   # FIXED

- name: Demand forecasting and purchasing recommendations
