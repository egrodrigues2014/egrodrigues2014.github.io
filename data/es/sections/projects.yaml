# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it, including the number of projects —
# a card missing from one language is invisible otherwise.
section:
  name: Proyectos
  id: projects                          # FIXED
  enable: true                          # FIXED
  weight: 40                            # FIXED
  showOnNavbar: true                    # FIXED

# `filter` is a CSS/JS token the theme writes into data-category, never a label.
# The checker asserts each button matches at least one project, because a button
# with no match empties the section when clicked.
buttons:
- name: Todos
  filter: "all"                         # FIXED
- name: Azure y Fabric
  filter: "azure"                       # FIXED
- name: Power BI
  filter: "power-bi"                    # FIXED
- name: Python y ML
  filter: "python"                      # FIXED
- name: SQL y ETL
  filter: "sql"                         # FIXED

# Cada proyecto es trabajo de cliente: privado, bajo confidencialidad y sin repo
# publico. Cada tarjeta apunta a un post de caso de estudio, que es tambien lo
# que da contenido al blog. Se nombra al empleador y al sector, nunca al cliente
# final, y todas las cifras de los posts son relativas.
#
# `repo:` no se usa a proposito: el tema lo renderiza como boton de estrellas de
# GitHub y sections/projects.js carga entonces buttons.github.io/buttons.js, una
# peticion a un tercero. `url:` produce un boton de detalles y ninguna peticion.
#
# `tags` es FIXED *y* se renderiza como chips visibles, asi que sale sin traducir
# en /es/ y /pt-br/. De ahi que sean nombres de tecnologia en minuscula.
projects:
- name: Medallion lakehouse on Azure and Fabric
  logo: /images/sections/skills/medallion.svg   # FIXED
  role: Arquitecto y desarrollador principal
  timeline: "02/2026"                   # FIXED
  url: /posts/medallion-lakehouse-azure-fabric/ # FIXED
  target: "self"                        # FIXED
  summary: "Capas bronce, plata y oro sobre ADLS Gen2, Azure SQL y Microsoft Fabric, con modelos dbt, linaje generado y cargas incrementales parametrizadas. La ventana de refresco pasó de un lote nocturno que se desbordaba a la mañana a un ciclo horario."
  tags: ["azure", "fabric", "dbt", "airflow"]   # FIXED

- name: Enterprise Power BI semantic model
  logo: /images/sections/skills/powerbi.svg     # FIXED
  role: Responsable del modelo semántico
  timeline: "02/2026"                   # FIXED
  url: /posts/enterprise-power-bi-semantic-model/ # FIXED
  target: "self"                        # FIXED
  summary: "Un único modelo compartido en lugar de varios ficheros de informe que discrepaban en el margen: composite Import más DirectQuery con el corte por periodo, seguridad a nivel de fila gobernada por datos y no por DAX fijo, y refresco incremental que pliega hacia el origen."
  tags: ["power-bi", "dax", "azure"]    # FIXED

- name: Natural-language analytics over the semantic model
