# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it.
section:
  name: Certificaciones
  id: accomplishments                   # FIXED
  enable: true                          # FIXED
  weight: 60                            # FIXED
  showOnNavbar: true                    # FIXED

# Fourteen credentials, every one with a working verification link. Each was
# opened and identified, not inferred from its URL.
#
# Order is by relevance to a data engineering profile. The two SAS courses come
# last on purpose: 2021, and no longer part of the current stack.
#
# Dropped by decision: the DataCamp "Associate Data Engineer" track (30 h). Its
# name is almost identical to the certification at the top, and two consecutive
# near-homonyms read as counting the same thing twice.
#
# DEA and AZ-900 also appear as visual badges in about.yaml. Deliberate: the
# badge is proof at a glance, this entry carries the date, expiry, hours and
# description that a badge image cannot show.
#
# The three GenAI Academy entries are NTT DATA's internal academy, issued through
# Skillsoft. They are learning completions, not exam-based certifications, so they
# belong in this list and NOT in the about.yaml badge grid — that grid is reserved
# for vendor certifications with official square artwork, and mixing a "White Belt"
# intro course in beside DEA and AZ-900 would read as equivalent when it is not.
# Listed highest belt first, which here is also reverse-chronological.
#
# Their issuer mark is the generic fa-certificate, shared with SAS and
# DeepLearning.AI: neither Simple Icons nor Font Awesome carries an NTT DATA or
# Skillsoft brand (checked, both 404). Six of fourteen entries now show the same
# mark — the alternative was an icon that misrepresents the issuer.
