# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it.
section:
  name: Formación
  id: education                         # FIXED
  template: sections/education.html     # FIXED (alternative: sections/education-alt.html, more compact)
  enable: true                          # FIXED
  weight: 50                            # FIXED
  showOnNavbar: true                    # FIXED

# `icon` is BARE here: sections/education.html prepends "fas " itself. Adding
# the prefix would emit class="fas fas fa-x". cards/skill.html works the other
# way round and does need the prefix — two conventions in the same theme.
#
# No `grade`: CGPA scales do not compare across Brazil, Spain and the
# anglosphere, so a bare number misleads. No `takenCourses`: coursework with
# marks fills half a screen and adds nothing next to seven years of experience.
# Institution logos are nil-guarded in the theme, so their absence is safe.
degrees:
- name: Ingeniería en Control y Automatización
  icon: fa-gears                       # FIXED
  timeframe: "2016 - 2018"                # FIXED
  institution:
    name: Universidade Federal do ABC         # FIXED
    url: "https://www.ufabc.edu.br"  # FIXED
  customSections:
  - name: Proyecto final
    content: "Publicación: *Landslide Detection System: Design and Development*"

- name: Grado en Ciencia y Tecnología
  icon: fa-graduation-cap                       # FIXED
  timeframe: "2011 - 2016"                # FIXED
  institution:
    name: Universidade Federal do ABC         # FIXED
    url: "https://www.ufabc.edu.br"  # FIXED

- name: Programa de intercambio — Ingeniería Eléctrica e Informática
  icon: fa-plane                       # FIXED
  timeframe: "2014 - 2015"                # FIXED
  institution:
    name: Florida Atlantic University         # FIXED
    url: "https://www.fau.edu"  # FIXED
