# section information
#
# Fields marked FIXED must be byte-identical in data/en, data/es and
# data/pt-br. `mise run verify` enforces it, including the number of bullets
# per position — a translation one bullet short is invisible otherwise.
section:
  name: Experiencia
  id: experiences                       # FIXED
  enable: true                          # FIXED
  weight: 30                            # FIXED
  showOnNavbar: true                    # FIXED

# Dates are MM/YYYY and FIXED. Month names would need translating three times
# ("Mar 2022" reads wrong in Spanish and Portuguese) — 39 more strings and 39
# more chances to misalign a month. Omitting `end` makes the theme insert its
# own localised [present] key, so never write "Present" by hand.
#
# No company logos yet: those fields are nil-guarded in the theme, so the cards
# render without them. Adding one is safe at any time.
experiences:
- company:
    name: MOD — Makers of Digital
    url: "https://mod.es"
    location: Barcelona, España
    overview: Consultora digital en Barcelona que construye productos de datos y software.
  positions:
  - designation: Lead Data Engineer
    start: "02/2026"
    # end omitted on purpose -> localised [present]
    responsibilities:
    - "Diseño capas de lakehouse **medallion** (bronze/silver/gold) sobre Azure Data Lake Storage Gen2, Azure SQL y Microsoft Fabric, dimensionando cada arquitectura a la carga real y no a una plantilla."
    - "Construyo y mantengo pipelines ETL/ELT en Python, Azure Data Factory y Airflow, con ingesta desde bases relacionales, APIs REST y sistemas ERP/CRM; los patrones de carga **incremental y parametrizada** reducen la ventana de proceso y el coste de cómputo."
    - "Modelo el data warehouse en [dbt](https://www.getdbt.com/) — esquemas en estrella, SCD tipo 2 y hechos snapshot — con control de versiones, tests automáticos y linaje documentado, optimizado con particionado, indexación y preagregación."
    - "Diseño modelos semánticos corporativos de Power BI, incluidos compuestos Import + DirectQuery, con DAX avanzado (inteligencia de tiempo, análisis de desviaciones, puentes M:N) y gobierno: seguridad a nivel de fila, refresco incremental, gateways on-premises y pipelines de despliegue."
    - "Soy responsable del CI/CD con Git y defino la estrategia de ramas, la estructura de repositorios y los estándares de onboarding del departamento de datos; llevo a producción modelos de forecasting (Prophet, scikit-learn) que alimentan la planificación de demanda y las recomendaciones de compra por local."

