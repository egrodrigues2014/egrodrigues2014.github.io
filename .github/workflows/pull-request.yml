name: PR Workflows

# Runs exactly the same gates as `mise run verify` does locally. That symmetry is
# the point: if CI checked something different, neither a green run here nor a
# green run locally would tell you much.

on: [pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # enableGitInfo needs real history for <lastmod>.
          fetch-depth: 0

      # Reads mise.toml, so the pinned hugo-extended, node and go match local.
      - uses: jdx/mise-action@v4

      - name: Install dependencies
        run: mise run install

      # Data-level gates first: fast, and they catch defects a build renders
      # happily anyway — a language missing its data tree produces an empty page
      # with a green build.
      - name: Cross-language parity
        run: node scripts/check-i18n.mjs

      - name: Asset references
        run: node scripts/check-assets.mjs

      - name: No personal data
        run: node scripts/check-pii.mjs

      # Was continue-on-error while it counted down from 118 hits. It reached
      # zero when the demo projects were replaced, so it is now a hard gate: the
      # theme's example data coming back fails the run.
      - name: No demo data
        run: node scripts/check-demo.mjs

      - name: Theme overrides in sync
        run: node scripts/check-overrides.mjs

      # --panicOnWarning: a Hugo warning fails the run. --printPathWarnings alone
      # printed and carried on, which in CI means nobody ever reads it.
      - name: Build
        run: hugo --gc --minify --cleanDestinationDir --printPathWarnings --panicOnWarning

      - name: Rendered output
        run: node scripts/check-render.mjs
