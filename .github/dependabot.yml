# Replaces the inherited daily cron workflow that opened theme-update PRs on its
# own. That was removed in F0.T4 because it targeted the theme author's
# resources; this is the sane version of the same intent.
#
# Weekly, not daily: this is a portfolio, and a PR queue nobody drains is worse
# than no automation. Monday morning is one decision a week.
version: 2

updates:
  # The Toha theme, consumed as a Hugo module and pinned in go.mod. Dependabot
  # reads go.mod, so it proposes tagged releases — which is what go.mod records.
  # Note the requirement is marked `// indirect`: Hugo puts it there because no
  # Go code imports it. Dependabot still tracks it.
  #
  # An upgrade will FAIL CI on purpose. Three files under layouts/ and
  # assets/scripts/ carry a THEME-VERSION marker, and check-overrides compares
  # each one against the version in go.mod — so the moment this bumps, the run
  # goes red until each copy has been diffed against its new upstream and the
  # marker updated. That red is the feature: it is what stops a stale copy
  # silently dropping something the theme added. The procedure is in the README
  # under "Maintaining the theme".
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - theme

  # The actions pinned in both workflows: checkout, mise-action, configure-pages,
  # upload-pages-artifact, deploy-pages.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore(ci)
    labels:
      - dependencies
      - github-actions

# Deliberately NOT configured:
#
#   npm — package.json and package-lock.json are generated by `hugo mod npm pack`
#         from the theme's own dependency list, and `mise run install` rewrites
#         them. Dependabot would open PRs against a file that is regenerated on
#         the next build, so they could not be merged meaningfully.
#
#   an `automerge` label — the inherited setup had one, but no bot here acts on
#   it. The PR workflow reports whether the site still builds and passes the
#   seven gates; a person decides. For a theme bump that decision is not
#   mechanical, because check-overrides will be red by design.
