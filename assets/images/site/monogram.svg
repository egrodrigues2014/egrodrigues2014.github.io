<!--
  Navbar brand mark for light backgrounds — params.logo.main, used on every page
  except the home.

  PLACEHOLDER, same monogram as monogram-badge.svg without the filled badge.

  Currently INERT: assets/styles/override.scss hides .navbar-brand entirely, so
  neither this nor monogram-inverted.svg is visible. They exist so that restoring
  the brand is a one-line CSS change rather than a branding exercise, and because
  the theme still downloads the inverted logo into a hidden <img> for its own JS.

  The stroke colour is explicit rather than `currentColor`: these are consumed via
  <img src>, which renders the SVG as an isolated document with nothing to inherit
  a colour from. That is also why there are two files instead of one.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ER">
  <g transform="translate(-2 0)" fill="none" stroke="#1e293b" stroke-width="7">
    <path d="M30 21H17v22h13"/>
    <path d="M17 32h10"/>
    <path d="M40 43V21h11v11H40"/>
    <path d="M43 32l8 11"/>
  </g>
</svg>
